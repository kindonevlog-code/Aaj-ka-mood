<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gazal Night</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#050817;
  color:white;
  font-family:Georgia,"Times New Roman",serif;
}

.app{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(3,7,25,.08) 0%,
      rgba(3,7,25,.16) 45%,
      rgba(3,7,25,.76) 100%
    ),
    url("file_0000000073ac81faa9e3f898936b5d5a.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.app::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 35%,
      rgba(0,0,0,.15) 58%,
      rgba(0,0,0,.72) 100%
    );
}

/* =========================
   TOP
========================= */

.top{
  position:absolute;
  z-index:5;

  top:20px;
  left:22px;
  right:22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:14px;
  letter-spacing:3px;
  color:#f1d8ad;

  text-shadow:
    0 2px 12px rgba(0,0,0,.8);
}

.badge{
  padding:7px 12px;

  border-radius:30px;

  border:1px solid rgba(255,255,255,.15);

  background:rgba(5,8,18,.35);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  font-family:Arial,sans-serif;
  font-size:10px;

  color:rgba(255,255,255,.8);
}

.dot{
  display:inline-block;

  width:6px;
  height:6px;

  margin-right:5px;

  border-radius:50%;

  background:#e3bd7f;

  box-shadow:
    0 0 10px rgba(227,189,127,.8);
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;
  z-index:3;

  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  padding-top:105px;
}

.eyebrow{
  margin-bottom:14px;

  font-family:Arial,sans-serif;

  font-size:9px;
  letter-spacing:4px;

  color:rgba(255,255,255,.58);
}

.title{
  font-size:clamp(52px,8vw,90px);

  line-height:.98;

  font-weight:700;

  letter-spacing:-2px;

  color:#f5dfbc;

  text-shadow:
    0 4px 22px rgba(0,0,0,.75),
    0 0 40px rgba(245,223,188,.12);
}

.divider{
  display:flex;
  align-items:center;

  gap:12px;

  margin-top:20px;
}

.line{
  width:55px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(245,223,188,.8)
    );
}

.line.right{
  background:
    linear-gradient(
      90deg,
      rgba(245,223,188,.8),
      transparent
    );
}

.diamond{
  width:6px;
  height:6px;

  background:#e5c38e;

  transform:rotate(45deg);
}

.subtitle{
  margin-top:13px;

  font-size:13px;

  color:rgba(255,235,207,.78);

  text-shadow:
    0 2px 10px rgba(0,0,0,.8);
}


/* =========================
   PLAYER
========================= */

.player{
  position:absolute;
  z-index:10;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:min(900px,calc(100% - 28px));

  padding:14px 16px 11px;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(18,21,33,.9),
      rgba(7,10,18,.86)
    );

  border:1px solid rgba(255,255,255,.16);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:
    0 20px 70px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.player-row{
  display:flex;
  align-items:center;

  gap:12px;
}


/* =========================
   COVER
========================= */

.cover{
  width:52px;
  height:52px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #94744c,
      #1b2033
    );

  border:1px solid rgba(255,255,255,.13);

  box-shadow:
    0 7px 22px rgba(0,0,0,.4);

  font-size:27px;

  color:#f1d4a4;

  transition:.25s;
}

.cover.playing{
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* =========================
   SONG INFO
========================= */

.info{
  flex:1;
  min-width:0;
}

.song-title{
  font-size:14px;
  font-weight:600;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  margin-top:4px;

  font-family:Arial,sans-serif;

  font-size:10px;

  color:rgba(255,255,255,.52);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   HEART
========================= */

.heart{
  width:34px;
  height:34px;

  flex-shrink:0;

  border:0;

  background:transparent;

  color:rgba(255,255,255,.75);

  font-size:21px;

  cursor:pointer;
}

.heart.active{
  color:#e5bd7d;
}


/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;
  align-items:center;

  gap:2px;

  flex-shrink:0;
}

.control{
  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:rgba(255,255,255,.86);

  font-size:14px;

  cursor:pointer;

  transition:.2s;
}

.control:hover{
  background:rgba(255,255,255,.09);

  transform:scale(1.08);
}

.control.active{
  color:#e5bd7d;
}

.play{
  width:45px;
  height:45px;

  background:#f7f4ed;

  color:#111;

  font-size:15px;

  box-shadow:
    0 5px 22px rgba(255,255,255,.16);
}

.play:hover{
  background:#fff;

  transform:scale(1.06);
}


/* =========================
   VOLUME
========================= */

.volume{
  display:flex;
  align-items:center;

  gap:7px;

  margin-left:5px;
}

.volume-icon{
  font-size:12px;
}

.volume-bar{
  width:55px;
  height:3px;

  border-radius:10px;

  background:rgba(255,255,255,.17);

  cursor:pointer;
}

.volume-fill{
  width:70%;
  height:100%;

  border-radius:10px;

  background:#e7cea5;
}


/* =========================
   PROGRESS
========================= */

.progress-area{
  margin-top:10px;
}

.progress-bar{
  width:100%;
  height:4px;

  border-radius:10px;

  overflow:hidden;

  background:rgba(255,255,255,.17);

  cursor:pointer;
}

.progress-fill{
  width:0%;
  height:100%;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #b8894d,
      #f4ddb5
    );

  box-shadow:
    0 0 9px rgba(230,190,125,.4);
}

.times{
  display:flex;
  justify-content:space-between;

  margin-top:5px;

  font-family:Arial,sans-serif;

  font-size:8px;

  color:rgba(255,255,255,.4);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .top{
    top:14px;
    left:13px;
    right:13px;
  }

  .brand{
    font-size:11px;
    letter-spacing:2px;
  }

  .badge{
    padding:6px 9px;
    font-size:8px;
  }

  .hero{
    padding-top:105px;
  }

  .eyebrow{
    font-size:7px;
    letter-spacing:3px;
  }

  .title{
    font-size:52px;
  }

  .subtitle{
    max-width:280px;
    font-size:11px;
  }

  .line{
    width:35px;
  }

  .player{
    width:calc(100% - 16px);

    bottom:20px;

    padding:11px;

    border-radius:19px;
  }

  .player-row{
    gap:8px;
  }

  .cover{
    width:45px;
    height:45px;

    border-radius:11px;

    font-size:23px;
  }

  .song-title{
    font-size:12px;
  }

  .artist{
    font-size:9px;
  }

  .heart{
    display:none;
  }

  .control{
    width:30px;
    height:30px;

    font-size:10px;
  }

  .play{
    width:40px;
    height:40px;
  }

  .volume{
    display:none;
  }

  .progress-area{
    margin-top:8px;
  }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

  .player{
    width:calc(100% - 10px);
    bottom:18px;

    padding:9px;
  }

  .control{
    width:27px;
    height:27px;
  }

  .play{
    width:37px;
    height:37px;
  }

  .song-title{
    font-size:11px;
  }

}
</style>
</head>


<body>

<div class="app">


  <!-- TOP -->

  <header class="top">

    <div class="brand">
      GAZAL NIGHT
    </div>

    <div class="badge">
      <span class="dot"></span>
      रात • सुकून • ग़ज़ल
    </div>

  </header>


  <!-- HERO -->

  <main class="hero">

    <div class="eyebrow">
      कुछ लम्हे • कुछ एहसास
    </div>

    <h1 class="title">
      सदाबहार<br>
      गाने
    </h1>

    <div class="divider">

      <span class="line"></span>

      <span class="diamond"></span>

      <span class="line right"></span>

    </div>

    <p class="subtitle">
      रात गहरी हो तो ग़ज़लें और भी अच्छी लगती हैं।
    </p>

  </main>


  <!-- PLAYER -->

  <section class="player">

    <div class="player-row">


      <div
        class="cover"
        id="cover"
      >
        ♪
      </div>


      <div class="info">

        <div
          class="song-title"
          id="songTitle"
        >
          हम को किसके ग़म ने मारा
        </div>

        <div
          class="artist"
          id="artist"
        >
          Ghulam Ali
        </div>

      </div>


      <button
        class="heart"
        id="heart"
      >
        ♡
      </button>


      <div class="controls">


        <button
          class="control"
          id="shuffle"
          title="Shuffle"
        >
          ⤨
        </button>


        <button
          class="control"
          id="previous"
          title="Previous"
        >
          ⏮
        </button>


        <button
          class="control play"
          id="play"
          title="Play"
        >
          ▶
        </button>


        <button
          class="control"
          id="next"
          title="Next"
        >
          ⏭
        </button>


        <button
          class="control"
          id="repeat"
          title="Repeat"
        >
          ↻
        </button>


      </div>


      <div class="volume">

        <span
          class="volume-icon"
          id="volumeIcon"
        >
          🔊
        </span>

        <div
          class="volume-bar"
          id="volumeBar"
        >

          <div
            class="volume-fill"
            id="volumeFill"
          ></div>

        </div>

      </div>


    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

      <div
        class="progress-bar"
        id="progressBar"
      >

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>


      <div class="times">

        <span id="currentTime">
          00:00
        </span>

        <span id="totalTime">
          00:00
        </span>

      </div>

    </div>


  </section>

</div>


<script>

/* ==========================================
   ONLY 2 UPLOADED SONGS
========================================== */

const songs = [

  {
    title:
      "हम को किसके ग़म ने मारा",

    artist:
      "Ghulam Ali",

    file:
      "music/Ham_Ko_Kiske_Gham_Ne_Mara___Ghulam_Ali_Ghazal___Old_Ghazals___Sad_Ghazals(256k).mp3"
  },


  {
    title:
      "चुपके चुपके रात दिन",

    artist:
      "Ghulam Ali",

    file:
      "music/Chupke_Chupke_Raat_Din_Aansoon_Bahana_Yaad_Hai___Ghulam_Ali_Ghazals___Old_ghazals___Sad_Ghazals(256k).mp3"
  }

];


/* ==========================================
   AUDIO
========================================== */

const audio =
  new Audio();

audio.preload =
  "metadata";

audio.volume =
  0.7;


/* ==========================================
   STATE
========================================== */

let currentSong =
  0;

let isPlaying =
  false;

let shuffle =
  false;

let repeat =
  false;


/* ==========================================
   ELEMENTS
========================================== */

const playButton =
  document.getElementById("play");

const previousButton =
  document.getElementById("previous");

const nextButton =
  document.getElementById("next");

const shuffleButton =
  document.getElementById("shuffle");

const repeatButton =
  document.getElementById("repeat");

const heartButton =
  document.getElementById("heart");

const songTitle =
  document.getElementById("songTitle");

const artist =
  document.getElementById("artist");

const cover =
  document.getElementById("cover");

const progressBar =
  document.getElementById("progressBar");

const progressFill =
  document.getElementById("progressFill");

const currentTime =
  document.getElementById("currentTime");

const totalTime =
  document.getElementById("totalTime");

const volumeBar =
  document.getElementById("volumeBar");

const volumeFill =
  document.getElementById("volumeFill");

const volumeIcon =
  document.getElementById("volumeIcon");


/* ==========================================
   LOAD SONG
========================================== */

function loadSong(
  index,
  autoplay = false
){

  currentSong =
    index;

  const song =
    songs[currentSong];


  songTitle.textContent =
    song.title;

  artist.textContent =
    song.artist;


  audio.src =
    song.file;

  audio.load();


  progressFill.style.width =
    "0%";

  currentTime.textContent =
    "00:00";

  totalTime.textContent =
    "00:00";


  if(autoplay){

    playSong();

  }

}


/* ==========================================
   PLAY
========================================== */

function playSong(){

  audio.play()

    .then(() => {

      isPlaying =
        true;

      playButton.textContent =
        "Ⅱ";

      cover.classList.add(
        "playing"
      );

    })

    .catch((error) => {

      console.error(
        "Audio error:",
        error
      );

      isPlaying =
        false;

      playButton.textContent =
        "▶";

      cover.classList.remove(
        "playing"
      );

      songTitle.textContent =
        "Song load nahi hua";

      artist.textContent =
        "GitHub file path check karein";

    });

}


/* ==========================================
   PAUSE
========================================== */

function pauseSong(){

  audio.pause();

  isPlaying =
    false;

  playButton.textContent =
    "▶";

  cover.classList.remove(
    "playing"
  );

}


/* ==========================================
   PLAY BUTTON
========================================== */

playButton.addEventListener(
  "click",
  () => {

    if(isPlaying){

      pauseSong();

    }else{

      playSong();

    }

  }
);


/* ==========================================
   NEXT
========================================== */

nextButton.addEventListener(
  "click",
  () => {

    let nextIndex;


    if(shuffle){

      nextIndex =
        Math.floor(
          Math.random() *
          songs.length
        );


      if(
        songs.length > 1 &&
        nextIndex === currentSong
      ){

        nextIndex =
          (nextIndex + 1)
          % songs.length;

      }

    }else{

      nextIndex =
        (currentSong + 1)
        % songs.length;

    }


    loadSong(
      nextIndex,
      true
    );

  }
);


/* ==========================================
   PREVIOUS
========================================== */

previousButton.addEventListener(
  "click",
  () => {

    if(
      audio.currentTime > 5
    ){

      audio.currentTime =
        0;

      return;

    }


    const previousIndex =
      (
        currentSong -
        1 +
        songs.length
      )
      %
      songs.length;


    loadSong(
      previousIndex,
      true
    );

  }
);


/* ==========================================
   SONG ENDED
========================================== */

audio.addEventListener(
  "ended",
  () => {

    if(repeat){

      audio.currentTime =
        0;

      playSong();

    }else{

      nextButton.click();

    }

  }
);


/* ==========================================
   PROGRESS
========================================== */

audio.addEventListener(
  "timeupdate",
  () => {

    if(
      !audio.duration ||
      !isFinite(audio.duration)
    ){

      return;

    }


    const percent =
      (
        audio.currentTime /
        audio.duration
      )
      * 100;


    progressFill.style.width =
      percent + "%";


    currentTime.textContent =
      formatTime(
        audio.currentTime
      );

  }
);


/* ==========================================
   METADATA
========================================== */

audio.addEventListener(
  "loadedmetadata",
  () => {

    totalTime.textContent =
      formatTime(
        audio.duration
      );

  }
);


/* ==========================================
   SEEK
========================================== */

progressBar.addEventListener(
  "click",
  (event) => {

    if(
      !audio.duration
    ){

      return;

    }


    const rect =
      progressBar.getBoundingClientRect();


    const percent =
      (
        event.clientX -
        rect.left
      )
      /
      rect.width;


    audio.currentTime =
      audio.duration *
      percent;

  }
);


/* ==========================================
   SHUFFLE
========================================== */

shuffleButton.addEventListener(
  "click",
  () => {

    shuffle =
      !shuffle;

    shuffleButton.classList.toggle(
      "active",
      shuffle
    );

  }
);


/* ==========================================
   REPEAT
========================================== */

repeatButton.addEventListener(
  "click",
  () => {

    repeat =
      !repeat;

    repeatButton.classList.toggle(
      "active",
      repeat
    );

  }
);


/* ==========================================
   HEART
========================================== */

heartButton.addEventListener(
  "click",
  () => {

    heartButton.classList.toggle(
      "active"
    );


    heartButton.textContent =
      heartButton.classList.contains(
        "active"
      )
      ? "♥"
      : "♡";

  }
);


/* ==========================================
   VOLUME
========================================== */

volumeBar.addEventListener(
  "click",
  (event) => {

    const rect =
      volumeBar.getBoundingClientRect();


    const percent =
      Math.max(
        0,
        Math.min(
          1,
          (
            event.clientX -
            rect.left
          )
          /
          rect.width
        )
      );


    audio.volume =
      percent;


    volumeFill.style.width =
      (percent * 100) +
      "%";


    if(percent === 0){

      volumeIcon.textContent =
        "🔇";

    }else if(percent < 0.5){

      volumeIcon.textContent =
        "🔉";

    }else{

      volumeIcon.textContent =
        "🔊";

    }

  }
);


/* ==========================================
   TIME FORMAT
========================================== */

function formatTime(
  seconds
){

  if(
    !isFinite(seconds) ||
    seconds < 0
  ){

    return "00:00";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remainingSeconds =
    Math.floor(
      seconds % 60
    );


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(
      remainingSeconds
    ).padStart(2,"0")
  );

}


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
  "keydown",
  (event) => {

    if(
      event.code === "Space"
    ){

      event.preventDefault();

      playButton.click();

    }


    if(
      event.code === "ArrowRight"
    ){

      nextButton.click();

    }


    if(
      event.code === "ArrowLeft"
    ){

      previousButton.click();

    }

  }
);


/* ==========================================
   INITIAL SONG
========================================== */

loadSong(
  0,
  false
);

</script>

</body>
</html>

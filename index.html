<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raju Mistri</title>
<link rel="preconnect" href="https://i.ytimg.com">
<style>
/* ─── config knobs ─────────────────────────────────────────────── */
:root{
  --player-top: 8px;        /* nudge the deck up/down */
  --player-w: 470px;
  --amber: #ffb02e;
  --amber-dim: #7a5312;
  --edge: 14px;             /* gap from the screen edge for the gear */
}
/* registered so the rim light can travel around the edge */
@property --ang{ syntax:'<angle>'; inherits:false; initial-value:150deg }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0b0d}
body{
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:#fff;
}

/* ─── background ───────────────────────────────────────────────── */
/* the image always renders; the video sits on top of it and fades in
   only once it can actually play — so the image doubles as the poster
   AND the fallback, with no flash of empty space in between */
#bg,#bgv{
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:var(--focal, 50% 50%);
}
#bg{animation:drift 40s ease-in-out infinite alternate}
#bgv{opacity:0; transition:opacity .8s ease}
#bgv.live{opacity:1}
@keyframes drift{ from{transform:scale(1.03)} to{transform:scale(1.09)} }

#bg-fallback{
  position:fixed; inset:0;
  background:
    radial-gradient(120% 80% at 50% 20%, #2a3b2e 0%, #12151a 60%, #08090b 100%);
}
#vignette{
  position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(130% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.45) 100%);
}

/* ─── shared glass recipe ──────────────────────────────────────── */
.glass{
  position:relative;
  isolation:isolate;
  background:
    linear-gradient(175deg,
      rgba(255,255,255,.22) 0%,
      rgba(255,255,255,.04) 45%,
      rgba(255,255,255,.09) 100%),
    rgba(16,17,21,.36);
  backdrop-filter:blur(30px) saturate(180%) brightness(.72);
  -webkit-backdrop-filter:blur(30px) saturate(180%) brightness(.72);
  box-shadow:
    0 10px 34px -10px rgba(0,0,0,.6),
    0 2px 10px -3px rgba(0,0,0,.35);
}
/* specular rim — a 1px gradient border, brightest where the light hits */
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit;
  padding:1px; pointer-events:none; z-index:2;
  background:linear-gradient(150deg,
    rgba(255,255,255,.9), rgba(255,255,255,.18) 28%,
    rgba(255,255,255,.04) 52%, rgba(255,255,255,.45));
  background:linear-gradient(var(--ang),
    rgba(255,255,255,.9), rgba(255,255,255,.18) 28%,
    rgba(255,255,255,.04) 52%, rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:turn 18s linear infinite;
}
@keyframes turn{ to{--ang:510deg} }
.glass > *{position:relative; z-index:3}

/* ─── player ───────────────────────────────────────────────────── */
#deck{
  position:fixed;
  top:calc(var(--player-top) + env(safe-area-inset-top));
  left:0; right:0; margin-inline:auto;   /* centred without a transform, so
                                            backdrop-filter stays reliable */
  width:min(var(--player-w), calc(100vw - 16px));
  border-radius:22px;
  padding:11px;
  display:flex; gap:11px; align-items:center;
  opacity:0; translate:0 -14px;
  transition:opacity .6s ease, translate .6s cubic-bezier(.2,.8,.2,1);
}
#deck.ready{opacity:1; translate:0 0}

/* soft sheen across the top third */
#deck::after{
  content:""; position:absolute; inset:0 0 auto; height:48%;
  border-radius:22px 22px 40% 40% / 22px 22px 100% 100%;
  pointer-events:none; z-index:1;
  background:linear-gradient(180deg, rgba(255,255,255,.16), transparent);
}

#art{
  width:52px; height:52px; flex:none;
  border-radius:13px; object-fit:cover;
  background:rgba(255,255,255,.08);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1px 0 rgba(255,255,255,.4),
    0 2px 8px -2px rgba(0,0,0,.5);
}

#mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}

/* dot-matrix readout */
#screen{
  position:relative; overflow:hidden;
  height:18px;
  border-radius:6px;
  background:rgba(4,6,8,.62);
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 16px -6px rgba(255,176,46,.35),
    0 1px 0 rgba(255,255,255,.16);
  padding:0 7px;
  mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
}
#title{
  position:absolute; top:50%; translate:0 -50%;
  white-space:nowrap;
  font:600 10.5px/1 ui-monospace,"SFMono-Regular",Menlo,monospace;
  letter-spacing:.11em; text-transform:uppercase;
  color:var(--amber); text-shadow:0 0 9px rgba(255,176,46,.55);
}
#title.scroll{animation:marquee var(--dur,12s) linear infinite}
@keyframes marquee{
  0%,8%{transform:translateX(0)}
  92%,100%{transform:translateX(var(--shift))}
}

/* progress */
#bar{
  position:relative; height:14px; display:flex; align-items:center;
  cursor:pointer; touch-action:none;
}
#bar::before{
  content:""; position:absolute; left:0; right:0; height:3px;
  border-radius:2px;
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.12);
}
#fill{
  position:relative; height:3px; border-radius:2px; width:0%;
  background:var(--amber); box-shadow:0 0 8px rgba(255,176,46,.6);
  transition:width .25s linear;
}
#fill::after{
  content:""; position:absolute; right:-4px; top:50%; translate:0 -50%;
  width:9px; height:9px; border-radius:50%; background:#fff;
  opacity:0; transition:opacity .15s;
}
#bar:hover #fill::after{opacity:1}

/* buttons */
#ctrls{display:flex; align-items:center; gap:2px; flex:none}
button{
  -webkit-tap-highlight-color:transparent;
  background:none; border:0; cursor:pointer; color:#fff;
  display:grid; place-items:center;
  border-radius:50%;
  font:inherit;
  transition:background .18s, box-shadow .18s, scale .12s, opacity .15s;
}
button:active{scale:.9}
button:hover{
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
button:disabled{opacity:.3; cursor:default; background:none; box-shadow:none}
.ico{width:34px; height:34px}
#play{
  width:40px; height:40px;
  background:rgba(255,255,255,.17);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 0 0 1px rgba(255,255,255,.14),
    0 2px 8px -3px rgba(0,0,0,.5);
}
#play:hover{background:rgba(255,255,255,.26)}
svg{
  width:16px; height:16px; fill:currentColor; display:block;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));
}
#play svg{width:18px; height:18px}

/* eq bars */
#eq{display:flex; align-items:flex-end; gap:2px; height:16px; padding:0 5px 0 2px; flex:none}
#eq i{
  width:2.5px; border-radius:1px; background:var(--amber-dim);
  height:3px; transition:background .3s;
}
body.playing #eq i{
  background:var(--amber);
  animation:bounce var(--d) ease-in-out infinite alternate;
}
@keyframes bounce{from{height:3px} to{height:15px}}

/* ─── settings ─────────────────────────────────────────────────── */
#gear{
  position:fixed; z-index:12;
  right:var(--edge);
  bottom:calc(var(--edge) + env(safe-area-inset-bottom));
  width:44px; height:44px;
  border-radius:50%;
  color:rgba(255,255,255,.9);
}
#gear svg{width:19px; height:19px; transition:rotate .5s cubic-bezier(.2,.8,.2,1)}
#gear[aria-expanded="true"] svg{rotate:75deg}

/* ─── credit ───────────────────────────────────────────────────── */
#credit{
  position:fixed; z-index:12;
  left:var(--edge);
  bottom:calc(var(--edge) + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:4px;
  padding:6px 8px 6px 13px; border-radius:999px;
  font:500 11px/1 ui-sans-serif,sans-serif;
  color:rgba(255,255,255,.78);
  white-space:nowrap;
}
#credit b{font-weight:600; color:rgba(255,255,255,.95)}
#credit .links{display:flex; gap:1px; margin-left:5px}
#credit a{
  display:grid; place-items:center;
  width:26px; height:26px; border-radius:50%;
  color:rgba(255,255,255,.72);
  transition:background .18s, color .18s, scale .12s;
}
#credit a:hover{color:#fff; background:rgba(255,255,255,.15)}
#credit a:active{scale:.9}
#credit svg{width:14px; height:14px}

/* ─── telegram banner ───────────────────────────────────────────── */
#telegram-banner{
  position:fixed; z-index:11;
  left:50%; translate:-50%;
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  padding:12px 24px; border-radius:999px;
  font:700 16px/1 ui-sans-serif,sans-serif; letter-spacing:.03em;
  color:#fff; background:rgba(0,136,204,.95);
  box-shadow:0 6px 24px -6px rgba(0,0,0,.6);
  text-decoration:none;
  display:flex; align-items:center; gap:10px;
  transition:background .2s, transform .2s;
}
#telegram-banner:hover{
  background:rgba(0,136,204,1);
  transform:translate(-50%, -3px);
  box-shadow:0 8px 32px -8px rgba(0,0,0,.7);
}
#telegram-banner svg{width:24px; height:24px; fill:currentColor}

#panel{
  position:fixed; z-index:12;
  right:var(--edge);
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  width:min(340px, calc(100vw - var(--edge) * 2));
  border-radius:20px; padding:16px;
  opacity:0; translate:0 12px; visibility:hidden;
  transition:opacity .3s ease, translate .3s cubic-bezier(.2,.8,.2,1), visibility .3s;
}
#panel.open{opacity:1; translate:0 0; visibility:visible}

#panel h2{
  font:700 11px/1 ui-monospace,monospace;
  letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.55); margin-bottom:13px;
}
.field label{
  display:block; margin-bottom:5px;
  font:600 10px/1.4 ui-monospace,monospace;
  letter-spacing:.13em; text-transform:uppercase;
  color:rgba(255,255,255,.62);
}
.hint{
  display:block; margin-top:6px;
  font:400 10.5px/1.45 ui-sans-serif,sans-serif;
  color:rgba(255,255,255,.38);
}
.err{
  display:none; margin-top:6px;
  font:500 10.5px/1.45 ui-sans-serif,sans-serif;
  color:#ff9782;
}
.err.show{display:block}
input[type=text]{
  width:100%; padding:9px 11px;
  font:400 12px/1.3 ui-monospace,monospace; color:#fff;
  background:rgba(4,6,8,.5);
  border:0; border-radius:10px;
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.09);
  outline:none;
  transition:box-shadow .2s;
}
input[type=text]:focus{
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,176,46,.65),
    0 0 0 3px rgba(255,176,46,.14);
}
input[type=text].bad,input[type=text].bad:focus{
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,120,100,.75),
    0 0 0 3px rgba(255,120,100,.14);
}
input[type=text]::placeholder{color:rgba(255,255,255,.26)}

.row{display:flex; gap:7px; align-items:center}
.btn{
  flex:1; height:36px; border-radius:11px;
  font:600 11px/1 ui-sans-serif,sans-serif; letter-spacing:.05em;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.09);
  color:#fff; white-space:nowrap; padding:0 10px;
}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{
  background:rgba(255,176,46,.9); color:#231602;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 10px -3px rgba(255,176,46,.6);
}
.btn.primary:hover{background:rgba(255,190,80,1)}
.sep{height:1px; background:rgba(255,255,255,.1); margin:15px 0 14px}

#toast{
  position:fixed; z-index:22;   /* above the gate, which covers everything else */
  right:var(--edge);
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  max-width:min(300px, calc(100vw - var(--edge) * 2));
  padding:9px 14px; border-radius:11px;
  font:600 11px/1.4 ui-sans-serif,sans-serif;
  background:rgba(255,176,46,.95); color:#231602;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.6);
  opacity:0; translate:0 8px; pointer-events:none;
  transition:opacity .25s, translate .25s;
}
#toast.show{opacity:1; translate:0 0}

/* ─── loader ───────────────────────────────────────────────────── */
#loader{
  position:fixed; inset:0; z-index:20;
  display:grid; place-items:center;
  background:#0b0b0d;
  text-align:center; padding:24px;
  transition:opacity .8s ease, visibility .8s;
}
#loader.gone{opacity:0; visibility:hidden; pointer-events:none}
#loader h1{
  font:800 clamp(30px,7vw,58px)/1 ui-sans-serif,sans-serif;
  letter-spacing:-.035em;
}
#loader h1 span{color:var(--amber)}
#lbar{
  width:min(200px,55vw); height:2px; margin:20px auto 0;
  border-radius:2px; background:rgba(255,255,255,.13); overflow:hidden;
}
#lbar i{
  display:block; height:100%; width:38%; border-radius:2px;
  background:var(--amber); box-shadow:0 0 10px rgba(255,176,46,.7);
  animation:slide 1.2s cubic-bezier(.6,.1,.4,.9) infinite;
}
@keyframes slide{ from{transform:translateX(-110%)} to{transform:translateX(300%)} }

/* shown only when the browser refused to start the audio itself */
#sound{
  position:fixed; z-index:13;
  top:calc(var(--player-top) + 76px + env(safe-area-inset-top));
  left:0; right:0; margin-inline:auto;
  width:max-content; max-width:calc(100vw - 24px);
  padding:9px 16px; border-radius:999px;
  font:600 11px/1 ui-sans-serif,sans-serif; letter-spacing:.04em;
  color:#231602; background:rgba(255,176,46,.94);
  box-shadow:0 8px 24px -8px rgba(0,0,0,.7);
  opacity:0; translate:0 -8px; visibility:hidden;
  transition:opacity .45s, translate .45s, visibility .45s;
}
#sound.show{opacity:1; translate:0 0; visibility:visible; animation:nudge 2.4s ease-in-out infinite}
#sound:hover{background:rgba(255,190,80,1)}
@keyframes nudge{0%,100%{scale:1} 50%{scale:1.05}}

#yt{position:fixed; width:1px; height:1px; left:-9999px; top:0; opacity:0; pointer-events:none}

@media (max-width:640px){
  :root{--player-top:6px; --edge:11px}
  #deck{padding:9px; gap:9px; border-radius:20px}
  #art{width:44px; height:44px; border-radius:11px}
  #eq{display:none}
  .ico{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  #bg{animation:none}
  #title.scroll{animation:none}
  .glass::before{animation:none}
  #gear svg{transition:none}
  body.playing #eq i{animation:none; height:8px}
}
</style>
</head>
<body>

<div id="bg-fallback"></div>
<img id="bg" alt="" onerror="this.style.display='none'">
<video id="bgv" muted loop playsinline preload="auto"></video>
<div id="vignette"></div>

<div id="deck" class="glass">
  <img id="art" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <div id="mid">
    <div id="screen"><div id="title">— — —</div></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="eq"></div>
  <div id="ctrls">
    <button class="ico" id="prev" title="Previous" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M7 5h2.5v14H7zM20 5v14L9.5 12z"/></svg>
    </button>
    <button id="play" title="Play" aria-label="Play">
      <svg id="play-i" viewBox="0 0 24 24"><path d="M7 4.5v15L20 12z"/></svg>
    </button>
    <button class="ico" id="next" title="Next" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M17 5h-2.5v14H17zM4 5v14l10.5-7z"/></svg>
    </button>
    <button class="ico" id="mute" title="Mute" aria-label="Mute">
      <svg id="mute-i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
  </div>
</div>

<!-- ─── settings ─────────────────────────────────────────────── -->
<button id="gear" class="glass" aria-expanded="false" aria-controls="panel" title="Settings" aria-label="Settings">
  <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5zm7.4-2.6a7.6 7.6 0 0 0 0-1.8l2-1.5a.5.5 0 0 0 .1-.6l-1.9-3.2a.5.5 0 0 0-.6-.2l-2.3.9a7.3 7.3 0 0 0-1.6-.9l-.3-2.4a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.3 2.4a7.3 7.3 0 0 0-1.6.9l-2.3-.9a.5.5 0 0 0-.6.2L2.5 9a.5.5 0 0 0 .1.6l2 1.5a7.6 7.6 0 0 0 0 1.8l-2 1.5a.5.5 0 0 0-.1.6l1.9 3.2a.5.5 0 0 0 .6.2l2.3-.9a7.3 7.3 0 0 0 1.6.9l.3 2.4a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.3-2.4a7.3 7.3 0 0 0 1.6-.9l2.3.9a.5.5 0 0 0 .6-.2l1.9-3.2a.5.5 0 0 0-.1-.6z"/></svg>
</button>

<div id="panel" class="glass" role="dialog" aria-label="Settings">
  <h2>Your playlist</h2>

  <div class="field">
    <label for="f-playlist">MP3 file names</label>
    <input type="text" id="f-playlist" placeholder="song1.mp3, song2.mp3, song3.mp3" spellcheck="false"
           autocomplete="off" autocapitalize="off">
    <span class="err" id="e-playlist"></span>
    <span class="hint">Enter MP3 file names separated by commas. Files must be in the same folder.</span>
  </div>

  <div class="sep"></div>

  <div class="row">
    <button class="btn primary" id="save">Play it</button>
    <button class="btn" id="share">Copy link</button>
    <button class="btn" id="reset">Reset</button>
  </div>
  <span class="hint" id="linkinfo" style="display:none"></span>
</div>

<div id="credit" class="glass">
  <span><b>Raju Mistri</b></span>
  <span class="links">
    <a href="https://www.instagram.com/ankitsharmatv/" target="_blank" rel="noopener noreferrer"
       title="Instagram" aria-label="Ankit Sharma on Instagram">
      <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.5-2.9a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3z"/></svg>
    </a>
    <a href="https://www.linkedin.com/in/ankitsharmatv/" target="_blank" rel="noopener noreferrer"
       title="LinkedIn" aria-label="Ankit Sharma on LinkedIn">
      <svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3V9zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C21.6 8.65 23 10.8 23 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2.01 0-2.32 1.57-2.32 3.2V21h-4V9z"/></svg>
    </a>
  </span>

<audio id="audio" preload="auto"></audio>

<script>
/* ══ AUTHOR SETTINGS ═════════════════════════════════════════════
   Background is yours, not the visitor's — edit it here. The video
   is optional; the image is both its poster and its fallback.      */
const BG_VIDEO = 'public/loop.mp4';
const BG_IMAGE = 'ChatGPT Image Aug 13, 2026, 02_12_42 PM copy.png';    /* poster while the video loads, and its fallback */
const MAX_WAIT = 6000;               /* never sit on the loader longer than this */

const PLAYLIST = [
  'Dil Ka Aalam Aashiqui 128 Kbps.mp3',
  'Ek Chumma Tu Mujhko Chhote Sarkar 128 Kbps copy.mp3',
  'Mein To Hoon Pagal Baadshah 128 Kbps copy.mp3',
  'Ajnabi Mujhko Itna Bata Pyaar To Hona Hi Tha 128 Kbps.mp3',
  'Bahut Jatate Ho Chah Humse(KoshalWorld.Com).mp3',
  'Chand Se Parda(KoshalWorld.Com).mp3',
  'Chura Ke Dil Mera Main Khiladi Tu Anari 128 Kbps.mp3',
  'Dard Karaara Dum Laga Ke Haisha 128 Kbps.mp3',
  'Dil Ka Aalam Aashiqui 320 Kbps.mp3',
  'Ghoonghat Ki Aadh Se Hum Hain Rahi Pyar Ke 128 Kbps.mp3',
  'Mera Sanam Sabse Pyara Hai(KoshalWorld.Com).mp3',
  'Na Kajare Ki Dhar Duet Version Mohra 128 Kbps.mp3',
  'Raah Mein Unse Mulaqat Vijaypath 128 Kbps.mp3',
  'Saat Samundar Paar Sad Vishwatma 128 Kbps.mp3',
  'Tere Pyar Mein Main Hogi Pyar Ki Jeet 128 Kbps.mp3',
  'Tip Tip Barsa Paani Mohra 128 Kbps.mp3'
];
const SHARE_HOURS = 24;              /* how long a copied link stays good */
const SHUFFLE = true, LOOP = true;
/* ════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const KEY = 'tuktuk:playlist';

/* base64url — keeps the ?s= payload short and URL-safe */
const b64 = {
  enc: o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))))
              .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: s => JSON.parse(new TextDecoder().decode(
              Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)))),
};

/* ── which playlist: use local MP3 files ─────────────────────── */
let playlist = [...PLAYLIST];
let currentIndex = 0;
let linkExpiry = null, expired = false;

try {
  const s = new URLSearchParams(location.search).get('s');
  if (s) {
    const d = b64.dec(s);
    if (d.e && Date.now() > d.e) expired = true;
    else if (Array.isArray(d.p) && d.p.length > 0) { playlist = d.p; linkExpiry = d.e || null; }
  } else {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) playlist = parsed;
      } catch (e) { /* invalid saved data, use default */ }
    }
  }
} catch (e) { /* malformed link or storage — stay on the default */ }

/* Declared up here, not down by the YouTube code: a cached background image
   makes markBg() fire synchronously during this first pass, and maybeStart()
   reads `ready` — a `let` below would be in the temporal dead zone and take
   the whole script down with it. */
let audio, ready = false, seeking = false;

/* ── background (author-controlled) ────────────────────────────── */
const bg = $('#bg'), bgv = $('#bgv');
const conn = navigator.connection;

/* Only skip the video when the visitor has actually asked us to: Data Saver
   on, a genuinely unusable connection, or reduced-motion. Deliberately NOT
   gating on '3g' — effectiveType is a rolling estimate over the browser's
   recent history, not this page load, and it routinely reads one tier low
   for the first second on a perfectly fast link. */
const holdVideo = () =>
  matchMedia('(prefers-reduced-motion: reduce)').matches ||
  !!(conn && (conn.saveData || /^(2g|slow-2g)$/.test(conn.effectiveType || '')));

let bgDone = false, started = false;
const markBg = () => { bgDone = true; maybeStart(); };

if (BG_IMAGE) bg.src = BG_IMAGE; else bg.style.display = 'none';

/* A single play() is not enough: changing .src aborts any play already in
   flight, and that rejection is indistinguishable from a policy block — so
   the only reliable approach is to keep nudging it whenever it could start. */
const nudgeVideo = () => { if (bgv.src && bgv.paused) bgv.play().catch(() => {}); };

function loadVideo() {
  if (!BG_VIDEO || bgv.src || holdVideo()) return;
  bgv.src = BG_VIDEO;
  nudgeVideo();
}

if (BG_VIDEO && !holdVideo()) {
  loadVideo();
  /* hold the loader until the loop can run start-to-finish without stalling —
     a background that hitches every 6s is worse than a second of waiting */
  bgv.addEventListener('canplaythrough', markBg, { once: true });
  bgv.addEventListener('error', markBg, { once: true });
} else if (BG_IMAGE) {
  bg.complete ? markBg()
              : (bg.addEventListener('load', markBg, { once: true }),
                 bg.addEventListener('error', markBg, { once: true }));
} else markBg();

/* if the browser revises its estimate upward, pick the video up late —
   it just fades in over the image whenever it's ready */
if (conn) conn.addEventListener('change', loadVideo);

bgv.addEventListener('canplay', () => { bgv.classList.add('live'); nudgeVideo(); });
bgv.addEventListener('loadeddata', nudgeVideo);
bgv.addEventListener('error', () => bgv.classList.remove('live'));  /* image shows through */

/* some browsers leave it paused after a tab switch or a wake from sleep */
document.addEventListener('visibilitychange', () => { if (!document.hidden) nudgeVideo(); });
addEventListener('pointerdown', nudgeVideo, { passive: true });

/* ── eq bars ───────────────────────────────────────────────────── */
$('#eq').innerHTML = [.9,.55,1.2,.7,1].map(d =>
  `<i style="--d:${d}s;animation-delay:-${d}s"></i>`).join('');

/* ── Audio Player ────────────────────────────────────────────────── */
audio = $('#audio');

function loadTrack(index) {
  if (index >= playlist.length) {
    if (LOOP) {
      currentIndex = 0;
    } else {
      return;
    }
  }
  audio.src = playlist[currentIndex];
  setTitle(playlist[currentIndex].replace('.mp3', ''));
  $('#art').src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%23ffb02e" width="100" height="100"/%3E%3Ctext x="50" y="55" text-anchor="middle" fill="%230b0b0d" font-size="40" font-weight="bold"%3E🎵%3C/text%3E%3C/svg%3E';
}

function onReady() {
  ready = true;
  loadTrack(currentIndex);
  $('#deck').classList.add('ready');
  maybeStart();
}

// Initialize immediately without waiting for audio load
onReady();

audio.addEventListener('loadedmetadata', () => {
  ready = true;
  $('#deck').classList.add('ready');
  maybeStart();
});

audio.addEventListener('play', () => {
  document.body.classList.add('playing');
  $('#play-i').innerHTML = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
  $('#play').title = 'Pause';
});

audio.addEventListener('pause', () => {
  document.body.classList.remove('playing');
  $('#play-i').innerHTML = '<path d="M7 4.5v15L20 12z"/>';
  $('#play').title = 'Play';
});

audio.addEventListener('ended', () => {
  if (LOOP || currentIndex < playlist.length - 1) {
    currentIndex = (currentIndex + 1) % playlist.length;
    loadTrack(currentIndex);
    audio.play();
  }
});

function syncMeta() {
  setTitle(playlist[currentIndex].replace('.mp3', ''));
}

/* ── marquee: only scroll when the title actually overflows ────── */
function setTitle(text) {
  const t = $('#title');
  t.classList.remove('scroll');
  t.style.transform = '';
  t.textContent = text;
  requestAnimationFrame(() => {
    const over = t.scrollWidth - $('#screen').clientWidth + 14;
    if (over > 0) {
      t.style.setProperty('--shift', `-${over}px`);
      t.style.setProperty('--dur', `${Math.max(8, over / 22)}s`);
      t.classList.add('scroll');
    }
  });
}

/* ── progress ──────────────────────────────────────────────────── */
setInterval(() => {
  if (!ready || seeking || !audio.duration) return;
  const dur = audio.duration;
  if (dur > 0) $('#fill').style.width = (audio.currentTime / dur) * 100 + '%';
}, 450);

/* ── controls ──────────────────────────────────────────────────── */
$('#play').onclick = () => {
  audio.paused ? audio.play() : audio.pause();
};
$('#next').onclick = () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  loadTrack(currentIndex);
  audio.play();
};
$('#prev').onclick = () => {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(currentIndex);
    audio.play();
  }
};
const ICON_SOUND = '<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
const ICON_MUTED = '<path d="M4 9v6h4l5 4V5L8 9H4zm15.5-1.1-1.4-1.4L15.7 9 13.3 6.5l-1.4 1.4L14.3 10l-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4L17.1 10z"/>';

let muted = false;

function setMuted(v) {
  muted = v;
  audio.muted = v;
  $('#mute-i').innerHTML = v ? ICON_MUTED : ICON_SOUND;
  $('#mute').title = v ? 'Unmute' : 'Mute';
  $('#mute').setAttribute('aria-label', v ? 'Unmute' : 'Mute');
}

$('#mute').onclick = () => setMuted(!muted);

/* scrub */
const seek = e => {
  const r = $('#bar').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, ((e.clientX ?? e.touches[0].clientX) - r.left) / r.width));
  $('#fill').style.width = p * 100 + '%';
  return p;
};
$('#bar').addEventListener('pointerdown', e => {
  if (!ready) return;
  seeking = true; seek(e); $('#bar').setPointerCapture(e.pointerId);
});
$('#bar').addEventListener('pointermove', e => { if (seeking) seek(e); });
$('#bar').addEventListener('pointerup', e => {
  if (!seeking) return;
  seeking = false;
  audio.currentTime = seek(e) * audio.duration;
});

/* keyboard — ignored while typing in the settings panel */
addEventListener('keydown', e => {
  if (e.key === 'Escape') return closePanel();
  if (!ready || e.target.matches('input')) return;
  const k = { ' ': '#play', ArrowRight: '#next', ArrowLeft: '#prev', m: '#mute' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});

/* ── settings panel ────────────────────────────────────────────── */
const panel = $('#panel'), gear = $('#gear'), field = $('#f-playlist'), err = $('#e-playlist');

function showErr(msg) { err.textContent = msg; err.classList.add('show'); field.classList.add('bad'); }
function clearErr() { err.classList.remove('show'); field.classList.remove('bad'); }
field.addEventListener('input', clearErr);

function relTime(ms) {
  const h = Math.floor(ms / 3600000);
  if (h >= 1) return `${h} hour${h > 1 ? 's' : ''}`;
  const m = Math.max(1, Math.round(ms / 60000));
  return `${m} minute${m > 1 ? 's' : ''}`;
}
function linkInfo() {
  $('#linkinfo').textContent = linkExpiry
    ? `You're on a shared link — it stops working in ${relTime(linkExpiry - Date.now())}.`
    : `Copied links last ${SHARE_HOURS} hours.`;
}

function openPanel() {
  field.value = playlist.join(','); clearErr();
  panel.classList.add('open');
  gear.setAttribute('aria-expanded', 'true');
}
function closePanel() {
  panel.classList.remove('open');
  gear.setAttribute('aria-expanded', 'false');
}
gear.onclick = () => panel.classList.contains('open') ? closePanel() : openPanel();
document.addEventListener('pointerdown', e => {
  if (panel.classList.contains('open') && !panel.contains(e.target) && !gear.contains(e.target))
    closePanel();
});

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* returns the validated playlist files, or null after showing the reason */
function readField() {
  const raw = field.value.trim();
  if (!raw) { showErr('Enter MP3 file names separated by commas.'); return null; }
  const files = raw.split(',').map(f => f.trim()).filter(f => f);
  if (files.length === 0) { showErr('Enter at least one MP3 file name.'); return null; }
  return files;
}

$('#save').onclick = () => {
  const files = readField();
  if (!files) return;

  playlist = files;
  currentIndex = 0;
  localStorage.setItem(KEY, JSON.stringify(files));
  closePanel();
  loadTrack(currentIndex);
  toast('Playlist updated');
};

$('#share').onclick = async () => {
  const files = readField();
  if (!files) return;
  const payload = { p: files, e: Date.now() + SHARE_HOURS * 3600000 };
  const url = location.origin + location.pathname + '?s=' + b64.enc(payload);
  try {
    await navigator.clipboard.writeText(url);
    toast(`Link copied — good for ${SHARE_HOURS} hours`);
  } catch (e) {
    prompt('Copy this link:', url);
  }
};

$('#reset').onclick = () => {
  localStorage.removeItem(KEY);
  playlist = [...PLAYLIST];
  currentIndex = 0;
  loadTrack(currentIndex);
  toast('Playlist reset to default');
};

/* ── start ─────────────────────────────────────────────────────── */
/* the loader lifts once the video can play through AND the player is up,
   whichever of those is slower — or after MAX_WAIT, so a stalled download
   can never strand anyone on the splash */
function maybeStart(force) {
  if (started) return;
  if (!force && !(bgDone && ready)) return;
  started = true;
  $('#loader').classList.add('gone');
  nudgeVideo();
  [400, 1200, 3000].forEach(ms => setTimeout(nudgeVideo, ms));   /* catch late aborts */
  if (expired) setTimeout(() => toast('That link has expired — playing the house selection.'), 900);

  /* on the forced path YouTube may still be coming up — wait for it there
     rather than holding the whole page hostage to a script that may be blocked */
  if (ready) startAudio();
  else {
    const t = setInterval(() => { if (ready) { clearInterval(t); startAudio(); } }, 150);
    setTimeout(() => clearInterval(t), 20000);
  }
}
setTimeout(() => maybeStart(true), MAX_WAIT);

/* Chrome allows audible autoplay only for sites the visitor uses often;
   everywhere else it's blocked. Ask for sound, and if the player hasn't
   moved a second later, take the muted consolation prize and say so. */
function startAudio() {
  setMuted(false);
  audio.play().catch(() => {
    setMuted(true);
    audio.play();
  });
}

</script>

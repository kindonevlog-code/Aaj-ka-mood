<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gazal Night | सदाबहार गाने</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #050817;
      color: #fff;
      font-family: "Noto Serif Devanagari", serif;
    }

    /* =========================
       MAIN SCREEN
    ========================= */

    .app {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      min-height: 620px;

      overflow: hidden;

      background-image:
        linear-gradient(
          180deg,
          rgba(3, 7, 25, 0.08) 0%,
          rgba(3, 7, 25, 0.15) 40%,
          rgba(3, 7, 25, 0.72) 100%
        ),
        url("file_0000000073ac81faa9e3f898936b5d5a.png");

      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* =========================
       CINEMATIC OVERLAY
    ========================= */

    .app::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 220, 170, 0.10),
          transparent 30%
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.18),
          transparent 50%,
          rgba(0, 0, 0, 0.18)
        );
    }

    .app::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent 35%,
          rgba(0, 0, 0, 0.12) 60%,
          rgba(0, 0, 0, 0.68) 100%
        );
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: absolute;

      top: 20px;
      left: 22px;
      right: 22px;

      z-index: 5;

      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: Georgia, serif;

      font-size: 14px;

      letter-spacing: 2px;

      color: #f1d8ad;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .status {
      display: flex;

      align-items: center;

      gap: 7px;

      padding: 7px 12px;

      border-radius: 30px;

      background: rgba(5, 8, 18, 0.35);

      border: 1px solid rgba(255,255,255,0.14);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      font-family: Arial, sans-serif;

      font-size: 10px;

      color: rgba(255,255,255,0.78);
    }

    .status-dot {
      width: 6px;
      height: 6px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #e3bd7f;

      box-shadow:
        0 0 10px rgba(227,189,127,0.8);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      z-index: 3;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;

      padding-top: clamp(85px, 12vh, 125px);
    }

    .eyebrow {
      font-family: Arial, sans-serif;

      font-size: 9px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: rgba(255,255,255,0.58);

      margin-bottom: 13px;
    }

    .title {
      font-size: clamp(48px, 8vw, 105px);

      line-height: 0.98;

      font-weight: 700;

      letter-spacing: -2px;

      color: #f5dfbc;

      text-shadow:
        0 4px 20px rgba(0,0,0,0.72),
        0 0 40px rgba(245,223,188,0.13);

      animation: titleIn 1.1s ease both;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-top: 19px;
    }

    .line {
      width: 55px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(245,223,188,0.75)
        );
    }

    .line.right {
      background:
        linear-gradient(
          90deg,
          rgba(245,223,188,0.75),
          transparent
        );
    }

    .diamond {
      width: 5px;
      height: 5px;

      transform: rotate(45deg);

      background: #e5c38e;
    }

    .subtitle {
      margin-top: 13px;

      font-size: 13px;

      color: rgba(255,235,207,0.76);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    /* =========================
       MUSIC PLAYER
    ========================= */

    .player {
      position: absolute;

      left: 50%;

      bottom: 22px;

      transform: translateX(-50%);

      z-index: 10;

      width: min(820px, calc(100% - 28px));

      padding: 15px 17px 12px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(18,21,33,0.88),
          rgba(7,10,18,0.82)
        );

      border: 1px solid rgba(255,255,255,0.16);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 20px 70px rgba(0,0,0,0.52),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .player-row {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    /* =========================
       COVER
    ========================= */

    .cover {
      position: relative;

      width: 50px;
      height: 50px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          #94744c,
          #1b2033
        );

      border: 1px solid rgba(255,255,255,0.13);

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 7px 22px rgba(0,0,0,0.4);
    }

    .cover::before {
      content: "♪";

      font-family: Georgia, serif;

      font-size: 25px;

      color: #f1d4a4;
    }

    /* =========================
       SONG INFO
    ========================= */

    .song-info {
      flex: 1;

      min-width: 0;
    }

    .song-title {
      font-size: 14px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      color: #fff;
    }

    .artist {
      margin-top: 3px;

      font-family: Arial, sans-serif;

      font-size: 10px;

      color: rgba(255,255,255,0.52);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;

      align-items: center;

      gap: 3px;

      flex-shrink: 0;
    }

    .control {
      width: 36px;
      height: 36px;

      border: none;

      border-radius: 50%;

      background: transparent;

      color: rgba(255,255,255,0.86);

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 14px;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .control:hover {
      background: rgba(255,255,255,0.09);

      transform: scale(1.1);
    }

    .play {
      width: 44px;
      height: 44px;

      background: #f7f4ed;

      color: #101010;

      font-size: 15px;

      box-shadow:
        0 5px 22px rgba(255,255,255,0.16);
    }

    .play:hover {
      background: #fff;

      transform: scale(1.06);
    }

    /* =========================
       HEART
    ========================= */

    .heart {
      width: 34px;
      height: 34px;

      border: none;

      background: transparent;

      color: rgba(255,255,255,0.72);

      font-size: 20px;

      cursor: pointer;
    }

    .heart.active {
      color: #e5bd7d;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-area {
      margin-top: 10px;
    }

    .progress-bar {
      width: 100%;

      height: 3px;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.17);

      overflow: hidden;

      cursor: pointer;
    }

    .progress-fill {
      width: 8%;

      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #b8894d,
          #f4ddb5
        );

      box-shadow:
        0 0 9px rgba(230,190,125,0.4);
    }

    .times {
      display: flex;

      justify-content: space-between;

      margin-top: 5px;

      font-family: Arial, sans-serif;

      font-size: 8px;

      color: rgba(255,255,255,0.4);
    }

    /* =========================
       VOLUME
    ========================= */

    .volume {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-left: 7px;
    }

    .volume-icon {
      font-size: 12px;

      opacity: 0.6;
    }

    .volume-bar {
      width: 55px;

      height: 3px;

      background:
        rgba(255,255,255,0.17);

      border-radius: 10px;
    }

    .volume-fill {
      width: 65%;

      height: 100%;

      background: #e7cea5;

      border-radius: inherit;
    }

    /* =========================
       TITLE ANIMATION
    ========================= */

    @keyframes titleIn {

      from {
        opacity: 0;

        transform: translateY(18px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .app {
        min-height: 100dvh;

        background-position: center center;
      }

      .topbar {
        top: 14px;

        left: 13px;

        right: 13px;
      }

      .brand {
        font-size: 11px;

        letter-spacing: 1.5px;
      }

      .status {
        padding: 6px 9px;

        font-size: 8px;
      }

      .hero {
        padding-top: 88px;
      }

      .eyebrow {
        font-size: 7px;

        letter-spacing: 3px;
      }

      .title {
        font-size: 52px;

        letter-spacing: -1px;
      }

      .subtitle {
        max-width: 270px;

        font-size: 11px;
      }

      .line {
        width: 35px;
      }

      /* PLAYER FIX */

      .player {
        width: calc(100% - 16px);

        bottom: 22px;

        padding:
          11px
          11px
          10px;

        border-radius: 19px;
      }

      .player-row {
        gap: 9px;
      }

      .cover {
        width: 45px;
        height: 45px;

        border-radius: 11px;
      }

      .song-title {
        font-size: 12px;
      }

      .artist {
        font-size: 9px;
      }

      .heart {
        display: none;
      }

      .control {
        width: 31px;
        height: 31px;

        font-size: 11px;
      }

      .play {
        width: 40px;
        height: 40px;

        font-size: 13px;
      }

      .volume {
        display: none;
      }

      .progress-area {
        margin-top: 8px;
      }

    }

    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      .player {
        bottom: 20px;

        width: calc(100% - 12px);

        padding: 9px;
      }

      .cover {
        width: 42px;
        height: 42px;
      }

      .controls {
        gap: 0;
      }

      .control {
        width: 28px;
        height: 28px;
      }

      .play {
        width: 38px;
        height: 38px;
      }

      .song-title {
        font-size: 11px;
      }

    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 900px) {

      .hero {
        padding-top: 85px;
      }

      .title {
        font-size: 88px;
      }

      .player {
        width: min(900px, calc(100% - 80px));

        bottom: 24px;
      }

      .cover {
        width: 56px;
        height: 56px;
      }

      .song-title {
        font-size: 15px;
      }

      .artist {
        font-size: 11px;
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

      <div class="brand">
        GAZAL NIGHT
      </div>

      <div class="status">

        <span class="status-dot"></span>

        रात • सुकून • ग़ज़ल

      </div>

    </header>


    <!-- =========================
         HERO
    ========================= -->

    <main class="hero">

      <div class="eyebrow">
        कुछ लम्हे • कुछ एहसास
      </div>

      <h1 class="title">
        सदाबहार<br>
        गाने
      </h1>

      <div class="divider">

        <span class="line"></span>

        <span class="diamond"></span>

        <span class="line right"></span>

      </div>

      <p class="subtitle">
        रात गहरी हो तो ग़ज़लें और भी अच्छी लगती हैं।
      </p>

    </main>


    <!-- =========================
         MUSIC PLAYER
    ========================= -->

    <section class="player">

      <div class="player-row">

        <div class="cover"></div>

        <div class="song-info">

          <div
            class="song-title"
            id="songTitle"
          >
            आपकी पसंदीदा ग़ज़ल
          </div>

          <div
            class="artist"
            id="artist"
          >
            Gazal Night Playlist
          </div>

        </div>


        <button
          class="heart"
          id="heartButton"
          aria-label="Favourite"
        >
          ♡
        </button>


        <div class="controls">

          <button
            class="control"
            id="shuffleButton"
            aria-label="Shuffle"
          >
            ⤨
          </button>

          <button
            class="control"
            id="previousButton"
            aria-label="Previous"
          >
            ⏮
          </button>

          <button
            class="control play"
            id="playButton"
            aria-label="Play"
          >
            ▶
          </button>

          <button
            class="control"
            id="nextButton"
            aria-label="Next"
          >
            ⏭
          </button>

          <button
            class="control"
            id="repeatButton"
            aria-label="Repeat"
          >
            ↻
          </button>

        </div>


        <div class="volume">

          <span class="volume-icon">
            🔊
          </span>

          <div class="volume-bar">

            <div class="volume-fill"></div>

          </div>

        </div>

      </div>


      <!-- PROGRESS -->

      <div class="progress-area">

        <div
          class="progress-bar"
          id="progressBar"
        >

          <div
            class="progress-fill"
            id="progressFill"
          ></div>

        </div>

        <div class="times">

          <span id="currentTime">
            00:00
          </span>

          <span>
            06:00
          </span>

        </div>

      </div>

    </section>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const playButton =
      document.getElementById("playButton");

    const heartButton =
      document.getElementById("heartButton");

    const progressBar =
      document.getElementById("progressBar");

    const progressFill =
      document.getElementById("progressFill");

    const currentTime =
      document.getElementById("currentTime");


    let playing = false;

    let progress = 8;


    /* PLAY / PAUSE */

    playButton.addEventListener(
      "click",
      () => {

        playing = !playing;

        playButton.textContent =
          playing ? "Ⅱ" : "▶";

      }
    );


    /* HEART */

    heartButton.addEventListener(
      "click",
      () => {

        heartButton.classList.toggle(
          "active"
        );

        heartButton.textContent =
          heartButton.classList.contains("active")
            ? "♥"
            : "♡";

      }
    );


    /* PROGRESS BAR */

    progressBar.addEventListener(
      "click",
      (event) => {

        const rect =
          progressBar.getBoundingClientRect();

        const position =
          (event.clientX - rect.left)
          / rect.width;

        progress =
          Math.max(
            0,
            Math.min(
              100,
              position * 100
            )
          );

        updateProgress();

      }
    );


    /* UPDATE PROGRESS */

    function updateProgress() {

      progressFill.style.width =
        progress + "%";

      const totalSeconds = 360;

      const seconds =
        Math.floor(
          totalSeconds *
          progress /
          100
        );

      const minutes =
        Math.floor(
          seconds / 60
        );

      const remainingSeconds =
        seconds % 60;

      currentTime.textContent =
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(
          remainingSeconds
        ).padStart(2, "0");

    }


    /* DEMO PLAYER MOVEMENT */

    setInterval(
      () => {

        if (!playing) return;

        progress += 0.12;

        if (progress >= 100) {
          progress = 0;
        }

        updateProgress();

      },
      1000
    );

  </script>

</body>
</html>

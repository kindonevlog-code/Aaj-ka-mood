<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gazal Night — सदाबहार गाने</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #050916;
      color: #fff;
      font-family: "Noto Serif Devanagari", serif;
    }

    /* =========================
       MAIN APP
    ========================= */

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(3, 7, 22, 0.12) 0%,
          rgba(3, 7, 22, 0.18) 40%,
          rgba(3, 7, 22, 0.62) 100%
        ),
        url("file_0000000073ac81faa9e3f898936b5d5a.png") center center / cover no-repeat;

    /* =========================
       DARK CINEMATIC OVERLAY
    ========================= */

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 22%,
          rgba(255, 222, 174, 0.08),
          transparent 28%
        ),
        linear-gradient(
          90deg,
          rgba(0,0,0,0.20),
          transparent 50%,
          rgba(0,0,0,0.20)
        );
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05),
          transparent 40%,
          rgba(0,0,0,0.40)
        );
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;

      z-index: 5;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: #f4dfbd;

      text-shadow:
        0 2px 12px rgba(0,0,0,0.7);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 7px 12px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 30px;

      background: rgba(0,0,0,0.22);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      font-family: Arial, sans-serif;
      font-size: 10px;

      color: rgba(255,255,255,0.75);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d8b57a;

      box-shadow:
        0 0 10px rgba(216,181,122,0.8);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      z-index: 3;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      text-align: center;

      padding-top: clamp(75px, 11vh, 120px);
    }

    .eyebrow {
      font-family: Arial, sans-serif;

      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;

      color: rgba(255,255,255,0.58);

      margin-bottom: 14px;
    }

    .title {
      font-size: clamp(48px, 8vw, 104px);

      line-height: 0.98;

      font-weight: 700;

      color: #f5dfbd;

      text-shadow:
        0 4px 20px rgba(0,0,0,0.55),
        0 0 45px rgba(245,223,189,0.12);

      letter-spacing: -2px;

      animation: titleIn 1.2s ease both;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 20px;
    }

    .divider-line {
      width: 55px;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(245,223,189,0.65)
      );
    }

    .divider-line.right {
      background: linear-gradient(
        90deg,
        rgba(245,223,189,0.65),
        transparent
      );
    }

    .divider-dot {
      width: 5px;
      height: 5px;

      transform: rotate(45deg);

      background: #e5c594;
    }

    .subtitle {
      margin-top: 14px;

      font-size: 14px;

      color: rgba(255,235,207,0.72);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    /* =========================
       AMBIENT LIGHT
    ========================= */

    .ambient {
      position: absolute;

      left: 50%;
      bottom: 17%;

      transform: translateX(-50%);

      width: 250px;
      height: 250px;

      border-radius: 50%;

      background: rgba(230,177,96,0.07);

      filter: blur(45px);

      pointer-events: none;
    }

    /* =========================
       MUSIC PLAYER
    ========================= */

    .player {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 10;

      width: min(780px, calc(100% - 32px));

      padding: 15px 18px 13px;

      border-radius: 22px;

      border: 1px solid rgba(255,255,255,0.14);

      background:
        linear-gradient(
          135deg,
          rgba(20,23,35,0.78),
          rgba(8,11,20,0.72)
        );

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 20px 70px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    /* =========================
       COVER
    ========================= */

    .cover {
      position: relative;

      width: 50px;
      height: 50px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          #806442,
          #171b2c
        );

      border: 1px solid rgba(255,255,255,0.12);

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 6px 20px rgba(0,0,0,0.3);
    }

    .cover::before {
      content: "♪";

      font-family: Georgia, serif;

      font-size: 25px;

      color: #f1d4a6;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      color: #fff;
    }

    .artist {
      margin-top: 3px;

      font-family: Arial, sans-serif;

      font-size: 10px;

      color: rgba(255,255,255,0.50);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heart {
      width: 34px;
      height: 34px;

      border: 0;
      background: transparent;

      color: rgba(255,255,255,0.65);

      font-size: 20px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .heart:hover {
      transform: scale(1.15);
      color: #e8c58e;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;
    }

    .control {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: rgba(255,255,
